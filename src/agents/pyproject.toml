[project]
name = "subagents"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.14.0",
    "deepagents>=0.5.7",
    "ipykernel>=7.2.0",
    "langchain>=1.2.18",
    "langchain-llama-server>=0.1.2",
    "langchain-mcp-adapters>=0.2.2",
    "lmdb>=2.2.1",
    "mcp>=1.27.1",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "pytest>=9.0.3",
    "rich>=15.0.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers==4.53.0",
    "yapf>=0.43.0",
]

[project.scripts]
subagents  = "subagents:main"

[tool.uv.sources]
langchain-llama-server = { path = "../../../langchain-llama-server" }
langchain-mcp-adapters = { path = "../../../../langchain-ai/langchain-mcp-adapters" }
